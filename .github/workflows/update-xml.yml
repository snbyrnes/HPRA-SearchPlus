name: Update HPRA Data

on:
  schedule:
    - cron: '0 5 * * *'  # Runs daily at 05:00 UTC
  workflow_dispatch:       # Allows manual trigger from GitHub Actions UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build data (download HPRA XML, parse, diff)
        run: node scripts/build-data.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/products-withdrawn.json data/changes.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update HPRA data [$(date -u +'%Y-%m-%d')]"
            git push
          fi
